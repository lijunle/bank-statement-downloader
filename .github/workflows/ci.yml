name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

# Concurrency ensures only the latest run for a given PR (or ref fallback) stays active.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdf-validation:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .agents/skills/pdf-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: .agents/skills/pdf-validation/requirements.txt
      - name: Install skill dependencies
        run: python -m pip install -r requirements.txt
      - name: Test PDF validation
        run: python -m unittest discover -s tests -v

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run type check
        run: npm run check
      - name: Run tests
        run: npm run test
      - name: Pack extension
        run: npm run pack
      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: bank-statement-downloader
          path: dist/*.zip
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
